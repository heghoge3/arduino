<text text-anchor="middle" x="616" y="-259.4" font-family="DejaVu Sans" font-size="12.00">Проверить E02/E03/E05/E06/E08/E11</text>
<text text-anchor="middle" x="616" y="-246.4" font-family="DejaVu Sans" font-size="12.00">B− НЕ соединять с OUT− перемычкой.</text>
<text text-anchor="middle" x="616" y="-233.4" font-family="DejaVu Sans" font-size="12.00">GPIO7 НЕ соединять с EN без D2.</text>
<text text-anchor="middle" x="616" y="-220.4" font-family="DejaVu Sans" font-size="12.00">GPIO3 НЕ соединять с батареей.</text>
<text text-anchor="middle" x="616" y="-207.4" font-family="DejaVu Sans" font-size="12.00">EN модуля может быть связан с VIN — проверить!</text>
<text text-anchor="middle" x="616" y="-194.4" font-family="DejaVu Sans" font-size="12.00">USB ESP32: развязка не определена.</text>
<text text-anchor="middle" x="616" y="-181.4" font-family="DejaVu Sans" font-size="12.00">Не объединять 5V USB ESP32 с LiPo/VPROT.</text>
<text text-anchor="middle" x="616" y="-168.4" font-family="DejaVu Sans" font-size="12.00">ON/OFF — запрос выключения, не разрыв батареи.</text>
<text text-anchor="middle" x="616" y="-155.4" font-family="DejaVu Sans" font-size="12.00">Все GND нагрузки = OUT−; штатный USB TP4056 не переделывать.</text>
</g>
