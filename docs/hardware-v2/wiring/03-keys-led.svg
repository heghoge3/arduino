<text text-anchor="middle" x="169.5" y="-651.4" font-family="DejaVu Sans" font-size="12.00">LED1/LED2 не назначать CHRG/STDBY по номеру!</text>
<text text-anchor="middle" x="169.5" y="-638.4" font-family="DejaVu Sans" font-size="12.00">Не параллелить внешние и штатные LED.</text>
<text text-anchor="middle" x="169.5" y="-625.4" font-family="DejaVu Sans" font-size="12.00">LED зарядки не питаются от SYS_3V3.</text>
<text text-anchor="middle" x="169.5" y="-612.4" font-family="DejaVu Sans" font-size="12.00">Нет утверждённой цепи драйвера зуммера.</text>
<text text-anchor="middle" x="169.5" y="-599.4" font-family="DejaVu Sans" font-size="12.00">Нет подтверждённой развязки USB ESP32.</text>
<text text-anchor="middle" x="169.5" y="-586.4" font-family="DejaVu Sans" font-size="12.00">Нет измеренных посадок/порядка выводов.</text>
<text text-anchor="middle" x="169.5" y="-573.4" font-family="DejaVu Sans" font-size="12.00">Закрыть E01–E16 перед заказом PCB.</text>
<text text-anchor="middle" x="169.5" y="-560.4" font-family="DejaVu Sans" font-size="12.00">Чертежи — электрические связи, не Gerber.</text>
