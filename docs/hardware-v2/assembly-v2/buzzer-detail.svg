<text x="30" y="710" class="warn">Диод: катод (полоска) к плюсу, анод к C3 / минусу зуммера.</text>
<text x="30" y="750">Схема утверждена владельцем. Электрическая приёмка ещё не выполнена.</text>
<text x="30" y="790">До фиксации PCB проверить ток, громкость, нагрев, выбросы и тишину при reset.</text>
<text x="30" y="830">GPIO5 питает только базу через R7. Не подключать к нему зуммер напрямую.</text>
</svg>