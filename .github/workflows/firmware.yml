name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "docs/protocol_vectors.json"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # Historical test_host/clock_test.cpp emulates removed DS1302 GPIOs.
      # Current DS3231 calendar checks run in the native test_v2 suite below.
      - name: Регрессии энергосбережения без платы
        run: |
          mkdir -p /tmp/vabugeode-tests
          g++ -std=gnu++17 -Wall -Wextra -Isrc -Ilib/core test_host/power_test.cpp lib/core/logic.cpp -o /tmp/vabugeode-tests/power_test
          /tmp/vabugeode-tests/power_test
      - name: Тесты ядра (протокол, NMEA, подмена, шаги, логика)
        run: pio test -e native
      - name: Проверки профилей, включая запрет сборки без GPIO
        run: python3 tools/check_power_profiles.py
      - name: USB-стенд ползунка — автономная сборка ожидает GPIO
        run: pio run -e s3_slider_bench
      - name: Прошивки
        uses: actions/upload-artifact@v4
        with:
          name: firmware-slider-usb-bench
          path: |
            firmware/.pio/build/s3_slider_bench/firmware.bin
