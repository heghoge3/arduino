name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "android/app/src/main/assets/firmware/**"
      - "docs/protocol_vectors.json"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio cryptography
      # Historical test_host/clock_test.cpp emulates removed DS1302 GPIOs.
      # Current DS3231 calendar checks run in the native test_v2 suite below.
      - name: Регрессии энергосбережения без платы
        run: |
          mkdir -p /tmp/vabugeode-tests
          g++ -std=gnu++17 -Wall -Wextra -Isrc -Ilib/core test_host/power_test.cpp lib/core/logic.cpp -o /tmp/vabugeode-tests/power_test
          /tmp/vabugeode-tests/power_test
      - name: Тесты ядра (протокол, NMEA, подмена, шаги, логика)
        run: pio test -e native
      - name: Проверки GPIO3 и защиты профилей
        run: python3 tools/check_power_profiles.py
      - name: Основной профиль GPIO3, fake и USB-стенд
        run: pio run -e s3 -e s3_ota_bootstrap -e s3_fake -e s3_slider_bench
      - name: Подпись и совместимость образа в APK (только публичный ключ)
        run: |
          python3 tools/verify_ota_bundle.py
          python3 -m unittest discover -s tools -p test_ota_tools.py -v
      - name: Сборка GPIO3 — аппаратная проверка не выполнена
        uses: actions/upload-artifact@v4
        with:
          name: firmware-v2-slider-gpio3-unverified
          path: firmware/.pio/build/s3/firmware.bin
      - name: USB-стенд
        uses: actions/upload-artifact@v4
        with:
          name: firmware-slider-usb-bench
          path: |
            firmware/.pio/build/s3_slider_bench/firmware.bin
