name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Debug-only signing key cache: preserve update compatibility while this cache exists.
      # Production distribution still needs a durable signing key in repository secrets.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vabugeode-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка и тесты
        run: ./gradlew --no-daemon assembleDebug assembleHike testDebugUnitTest
      - name: APK для телефона
        uses: actions/upload-artifact@v4
        with:
          name: vabugeode-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK Поход (устанавливается рядом со старой версией)
        uses: actions/upload-artifact@v4
        with:
          name: vabugeode-hike-apk
          path: android/app/build/outputs/apk/hike/app-hike.apk
      - name: Скриншоты экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/screenshots/
