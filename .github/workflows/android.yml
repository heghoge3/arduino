name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_BUNDLE != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Тестовая сборка и тесты
        run: ./gradlew --no-daemon --max-workers=4 assembleDebug testDebugUnitTest
      - name: Подписанный APK с постоянным ключом
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 tools/build_signed_apk.py
      - name: APK для телефона
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vabugeode-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Локальная подпись APK
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo 'Подписанные APK готовит агент локально постоянным ключом владельца. Настройка Secrets пользователем не требуется.' >> "$GITHUB_STEP_SUMMARY"
      - name: Скриншоты экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/screenshots/
