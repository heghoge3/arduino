; vabuGEOde — прошивка устройства (ТЗ: CLAUDE.md, логика: docs/gadget-logic.md, протокол: docs/protocol.md)
;
; Окружения:
;   s3      — рабочая прошивка для TENSTAR ESP32-S3-Zero
;   s3_fake — та же прошивка, но датчики и GPS эмулируются (FAKE_SENSORS): если пришла только плата
;   native  — тесты ядра (протокол, NMEA, подмена, логика) на компьютере: pio test -e native

[platformio]
default_envs = s3

[esp32s3_base]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; S3-Zero: 4 МБ flash, 2 МБ PSRAM (quad). OTA не нужен — большой раздел под приложение
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    olikraus/U8g2 @ ^2.35.19
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit INA219 @ ^1.2.3

[env:s3]
extends = esp32s3_base

[env:s3_fake]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DFAKE_SENSORS=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -DUNITY_INCLUDE_DOUBLE
